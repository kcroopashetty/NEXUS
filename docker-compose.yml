services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_secure_password_replace_in_prod}
    # Port 5432 kept internal to nexus-network to prevent direct unauthorized external database access
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    # Port 11434 kept internal to prevent unauthenticated direct LLM prompting from outside Docker
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NEXUS_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus_user}:${POSTGRES_PASSWORD:-nexus_secure_password_replace_in_prod}@postgres:5432/${POSTGRES_DB:-nexus_db}
      NEXUS_STORAGE_DIR: /data/nexus
      VECTOR_STORE_BACKEND: postgres_pgvector
      PGVECTOR_INDEX_TYPE: hnsw
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-llama3.2:3b}
      INFERENCE_CONCURRENCY_LIMIT: 2
      INFERENCE_QUEUE_LIMIT: 16
      RATE_LIMIT_PER_MINUTE: 120
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - nexus_storage:/data/nexus
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
  nexus_storage:
